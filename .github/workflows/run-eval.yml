# Runs model calls with the GEMINI_API_KEY repo secret and commits the results back.
# Start it from the Actions tab (or the API) with a command such as:
#   models
#   validate-judge --judge gemini-3.8-flash --split dev
#   generate --models gemini-3.6-flash,gemma-3-27b-it
#   judge --judge gemini-3.8-flash
#   report --judge gemini-3.8-flash
name: run eval
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Arguments for python -m dpdp_eval (one or more, separated by ' ; ')"
        required: true
        default: "models"
permissions:
  contents: write
concurrency:
  group: run-eval
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CMDS: ${{ inputs.command }}
        run: |
          set -o pipefail
          IFS=';' read -ra parts <<< "$CMDS"
          for c in "${parts[@]}"; do
            c="$(echo "$c" | xargs)"
            [ -z "$c" ] && continue
            echo "::group::python -m dpdp_eval $c"
            # shellcheck disable=SC2086
            python -m dpdp_eval $c 2>&1 | tee -a run.log
            echo "::endgroup::"
          done
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ || true
          if git diff --cached --quiet; then echo "no new results"; exit 0; fi
          git commit -m "results: ${{ inputs.command }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
